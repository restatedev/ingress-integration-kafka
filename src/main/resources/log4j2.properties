# Default Log4j2 configuration bundled in the image.
#
# Override without rebuilding by pointing Log4j2 at your own file (works when using this image as
# a base image or at runtime):
#   -e LOG4J_CONFIGURATION_FILE=/etc/restate/log4j2.properties     (env var, Log4j2 native)
#   -Dlog4j2.configurationFile=/etc/restate/log4j2.properties      (JVM system property)
status = warn
name = default
# Disable Log4j2's own JVM shutdown hook so logs emitted during graceful shutdown
# (verticle stop(), offset flush) are not swallowed as the process exits.
shutdownHook = disable

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %logger{36} - %msg%n

# The application's own logs.
logger.app.name = dev.restate
logger.app.level = info

# The Kafka client is chatty at INFO; keep it at WARN unless debugging.
logger.kafka.name = org.apache.kafka
logger.kafka.level = warn

rootLogger.level = info
rootLogger.appenderRef.console.ref = Console
