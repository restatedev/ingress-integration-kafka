# Kubernetes ServiceAccount linked to the IAM service account via Workload
# Identity. Pods that run as this KSA authenticate to Managed Kafka as ${GSA_EMAIL}
# (which holds roles/managedkafka.client) through Application Default Credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${KSA_NAME}
  namespace: ${NAMESPACE}
  annotations:
    iam.gke.io/gcp-service-account: ${GSA_EMAIL}
